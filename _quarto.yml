  page-navigation: true
  chapters:
  - index.qmd
  - dinamica_trabajo.qmd
  - part: "**Exploración y clustering**"
    chapters:
    - cap01_intro_datos.qmd
    - cap02_clustering.qmd
  - part: "**Sección 3**"
    chapters:
    - Cap3A.qmd
  - part: "**Sección 4**"
    chapters:
    - Cap5A.qmd
    - Cap5B.qmd
  - part: "**Sección 5**"
    chapters:
    - Cap4A.qmd
  - part: "**Sección 6**"
    chapters:
    - Cap6A.qmd
  # Information
  site-url: https://github.com/MicroAgroBiome/MicroAgroBiome_bioinfo2026_libro # 📍URL del sitio completo Rladies Mexico
  repo-url: https://github.com/MicroAgroBiome/MicroAgroBiome_bioinfo2026_libro  # link de Github
  sharing: [twitter, facebook, linkedin]
  favicon: "logos/favicon.png" # icono de la pagina en pestana

format:
  html:
    logo: "logos/favicon.png"
    toc-depth: 4
    number-depth: 3
    # css
    css: styles.css
  # Boton para cambiar tema de oscuro a claro
    theme:
      light: cosmo
      # dark: darkly
    code-fold: show # Ocultar codigo
    code-copy: true # Copy button
    freeze: false  # Desactivar congelamiento

editor: visual

lang: es # configuración en Español

execute:
  error: true # Se aceptan errores
  message: false # Silenciar mensajes de salida
  echo: true
  freeze: auto   # mover aquí; dentro de format: html: Quarto lo ignora

bibliography: references.bib
